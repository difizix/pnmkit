[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pnmkit"
version = "0.1.0"
description = "Python utilities for pore-scale modelling"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "vtk",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=7",
    "image3kit>=0.2.0",
]
foam = [
    "image3kit>=0.2.0",
]

[tool.setuptools]
package-dir = {"pnmkit" = "."}
packages = ["pnmkit", "pnmkit.foam_variants"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
extend-select = [
    "B",           # flake8-bugbear
    "I",           # isort
    "ARG",         # flake8-unused-arguments
    "C4",          # flake8-comprehensions
    "EM",          # flake8-errmsg
    "ICN",         # flake8-import-conventions
    "G",           # flake8-logging-format
    "PGH",         # pygrep-hooks
    "PIE",         # flake8-pie
    "PL",          # pylint
    "PT",          # flake8-pytest-style
    "PTH",         # flake8-use-pathlib
    "RET",         # flake8-return
    "RUF",         # Ruff-specific
    "SIM",         # flake8-simplify
    "UP",          # pyupgrade
    "YTT",         # flake8-2020
    "EXE",         # flake8-executable
    "NPY",         # NumPy specific rules
    "PD",          # pandas-vet
]
ignore = [
    "E501",        # line-too-long: preserve all long lines without breaking them
    "B006",        # legacy call sites with mutable defaults
    "PLR09",       # too many branches / arguments / statements
    "PLR2004",     # magic value in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "ARG001", "ARG002"]
"extra/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
